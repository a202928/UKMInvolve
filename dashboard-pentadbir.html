<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pentadbir | UKMInvolve</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Pembolehubah asas jika style.css tidak dimuatkan */
        :root {
            --surface: #ffffff;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .stat-card {
            background: var(--surface);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 30px;
            color: white;
            padding: 15px;
            border-radius: 12px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-users { background: #3b82f6; }
        .icon-programs { background: #10b981; }
        .icon-categories { background: #8b5cf6; }
        .icon-feedback { background: #f59e0b; }

        .stat-value {
            font-size: 38px;
            font-weight: 700;
            margin-top: 10px;
        }

        .stat-title {
            font-size: 14px;
            color: gray;
        }

        .stat-trend {
            font-size: 14px;
            margin-top: 6px;
            color: #10b981;
            font-weight: 600;
        }

        .metrics-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            border-bottom: 4px solid #3b82f6;
        }

        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
        }

        /* Sidebar & Topbar placeholder */
        .sidebar {
            width: 250px;
            background: #1e293b;
            color: white;
            min-height: 100vh;
            position: fixed;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">
        <div style="padding: 20px; text-align: center;">
            <h2>UKMInvolve</h2>
            <hr style="opacity: 0.2;">
        </div>
        <nav style="padding: 10px;">
            <div style="padding: 10px; background: #334155; border-radius: 8px;">
                <i class="fas fa-th-large"></i> Dashboard
            </div>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar" style="height: 60px; background: white; margin-bottom: 20px; border-radius: 12px; display: flex; align-items: center; padding: 0 20px; box-shadow: var(--shadow);">
            <div style="margin-left: auto;">
                <button onclick="exportStatistics()" style="background: #1e293b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">
                    <i class="fas fa-download"></i> Eksport Laporan
                </button>
            </div>
        </header>

        <section class="content dashboard-container">

            <h1 style="margin-bottom: 5px;">Dashboard Pentadbir</h1>
            <p style="color: gray; margin-bottom: 30px;">Ringkasan keseluruhan sistem UKMInvolve</p>

            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-icon icon-users"><i class="fas fa-users"></i></div>
                    <div class="stat-value">2,450</div>
                    <div class="stat-title">Jumlah Pengguna</div>
                    <div class="stat-trend">+22.5%</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon icon-programs"><i class="fas fa-calendar"></i></div>
                    <div class="stat-value">156</div>
                    <div class="stat-title">Jumlah Program</div>
                    <div class="stat-trend">+30%</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon icon-categories"><i class="fas fa-tags"></i></div>
                    <div class="stat-value">12</div>
                    <div class="stat-title">Kategori Program</div>
                    <div class="stat-trend" style="color: #64748b;">Kekal</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon icon-feedback"><i class="fas fa-comments"></i></div>
                    <div class="stat-value">1,245</div>
                    <div class="stat-title">Maklum Balas</div>
                    <div class="stat-trend">+24.5%</div>
                </div>

            </div>

            <h2 style="margin-top:40px; border-left: 5px solid #3b82f6; padding-left: 15px;">Prestasi Sistem</h2>

            <div class="metrics-grid">

                <div class="metric-card">
                    <div class="metric-value">4.7/5</div>
                    <div style="color: gray; font-size: 14px;">Rating Program</div>
                </div>

                <div class="metric-card">
                    <div class="metric-value">82%</div>
                    <div style="color: gray; font-size: 14px;">Kehadiran</div>
                </div>

                <div class="metric-card">
                    <div class="metric-value">65%</div>
                    <div style="color: gray; font-size: 14px;">Kadar Feedback</div>
                </div>

                <div class="metric-card">
                    <div class="metric-value">99.8%</div>
                    <div style="color: gray; font-size: 14px;">System Uptime</div>
                </div>

                <div class="metric-card">
                    <div class="metric-value">124</div>
                    <div style="color: gray; font-size: 14px;">Sesi Aktif</div>
                </div>

            </div>

        </section>
    </main>
</div>

<script>
    function exportStatistics(){
        alert("Fungsi export belum disambungkan dengan database lagi.");
    }
</script>

</body>
</html>
