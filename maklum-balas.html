<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maklum Balas Program | UKMInvolve</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Feedback Form Styling */
        .feedback-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .form-section {
            background: var(--surface, #ffffff);
            border-radius: var(--radius, 8px);
            padding: 32px;
            box-shadow: var(--shadow, 0 4px 6px rgba(0,0,0,0.1));
            border: 1px solid var(--border, #e5e7eb);
            margin-bottom: 24px;
        }
        
        .program-info {
            background: var(--background, #f9fafb);
            padding: 16px;
            border-radius: var(--radius, 8px);
            margin-bottom: 24px;
            border-left: 4px solid var(--primary, #2563eb);
        }
        
        .question-group {
            margin-bottom: 32px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border, #e5e7eb);
        }
        
        .question-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .question-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary, #111827);
            margin-bottom: 16px;
            display: block;
        }
        
        /* Star Rating */
        .star-rating {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        
        .star-btn {
            background: none;
            border: none;
            font-size: 32px;
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px;
        }
        
        .star-btn:hover { transform: scale(1.1); }
        .star-btn.active { color: #f59e0b; }
        .star-btn.hovered { color: #fbbf24; }
        
        /* Radio Group */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 16px 0;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--border, #e5e7eb);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .radio-option:hover {
            border-color: var(--primary, #2563eb);
            background: rgba(37, 99, 235, 0.05);
        }
        
        .radio-option.selected {
            border-color: var(--primary, #2563eb);
            background: rgba(37, 99, 235, 0.1);
        }
        
        .radio-input { margin-right: 12px; width: 18px; height: 18px; }
        .radio-label { flex: 1; cursor: pointer; font-weight: 500; }
        
        .feedback-textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border, #e5e7eb);
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            margin: 16px 0;
        }
        
        .required { color: #ef4444; margin-left: 4px; }
        .error-message { color: #ef4444; font-size: 14px; margin-top: 8px; display: none; }
        .rating-labels { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; }

        /* General Button Fallback */
        .btn-primary {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        </aside>

    <main class="main-content">
        <header class="topbar"></header>

        <section class="content">
            <div class="feedback-container">
                <div class="welcome-section">
                    <h1 class="page-title">Maklum Balas Program</h1>
                    <p class="page-subtitle">Beri penilaian anda terhadap program yang telah dihadiri</p>
                </div>

                <div class="program-info">
                    <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Workshop Pemikiran Kritikal</h3>
                    <div style="display: flex; gap: 24px; font-size: 14px; color: #6b7280;">
                        <span><i class="fas fa-calendar"></i> 15 Januari 2026</span>
                        <span><i class="fas fa-map-marker-alt"></i> Bilik Seminar A</span>
                    </div>
                </div>

                <form id="feedbackForm" class="form-section">
                    <div class="question-group">
                        <label class="question-label">
                            1. Bagaimanakah penilaian keseluruhan anda terhadap program ini?<span class="required">*</span>
                        </label>
                        <div class="star-rating" id="rating1">
                            <button type="button" class="star-btn" data-value="1"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="2"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="3"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="4"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="5"><i class="fas fa-star"></i></button>
                        </div>
                        <div class="rating-labels">
                            <span>Sangat Tidak Memuaskan</span>
                            <span>Sangat Memuaskan</span>
                        </div>
                        <input type="hidden" name="penilaian_keseluruhan" id="penilaian_keseluruhan" value="0">
                        <div class="error-message" id="error1">Sila berikan penilaian</div>
                    </div>

                    <div class="question-group">
                        <label class="question-label">
                            2. Adakah objektif program ini berjaya dicapai?<span class="required">*</span>
                        </label>
                        <div class="radio-group" id="rating2">
                            <div class="radio-option">
                                <input type="radio" name="pencapaian_objektif" value="sangat-tidak-setuju" id="obj_1" class="radio-input">
                                <label for="obj_1" class="radio-label">Sangat Tidak Setuju</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="pencapaian_objektif" value="tidak-setuju" id="obj_2" class="radio-input">
                                <label for="obj_2" class="radio-label">Tidak Setuju</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="pencapaian_objektif" value="neutral" id="obj_3" class="radio-input">
                                <label for="obj_3" class="radio-label">Neutral</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="pencapaian_objektif" value="setuju" id="obj_4" class="radio-input">
                                <label for="obj_4" class="radio-label">Setuju</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="pencapaian_objektif" value="sangat-setuju" id="obj_5" class="radio-input">
                                <label for="obj_5" class="radio-label">Sangat Setuju</label>
                            </div>
                        </div>
                        <div class="error-message" id="error2">Sila pilih satu pilihan</div>
                    </div>

                    <div class="question-group">
                        <label class="question-label">
                            3. Bagaimanakah tahap pengurusan program oleh pihak penganjur?<span class="required">*</span>
                        </label>
                        <div class="star-rating" id="rating3">
                            <button type="button" class="star-btn" data-value="1"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="2"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="3"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="4"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-value="5"><i class="fas fa-star"></i></button>
                        </div>
                        <div class="rating-labels">
                            <span>Sangat Lemah</span>
                            <span>Sangat Baik</span>
                        </div>
                        <input type="hidden" name="pengurusan_program" id="pengurusan_program" value="0">
                        <div class="error-message" id="error3">Sila berikan penilaian</div>
                    </div>

                    <div class="question-group">
                        <label class="question-label">
                            4. Sila nyatakan komen atau cadangan penambahbaikan
                        </label>
                        <textarea name="komen" class="feedback-textarea" placeholder="Contoh: Pengurusan masa sangat baik..."></textarea>
                    </div>

                    <div style="padding-top: 24px; border-top: 1px solid #e5e7eb;">
                        <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; font-size: 16px;">
                            <i class="fas fa-paper-plane"></i> Hantar Maklum Balas
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Star Rating Logic
        const starContainers = document.querySelectorAll('.star-rating');
        starContainers.forEach(container => {
            const stars = container.querySelectorAll('.star-btn');
            const hiddenInput = container.parentElement.querySelector('input[type="hidden"]');
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    hiddenInput.value = value;
                    stars.forEach(s => {
                        s.classList.toggle('active', s.getAttribute('data-value') <= value);
                        s.querySelector('i').style.color = s.getAttribute('data-value') <= value ? '#f59e0b' : '#ddd';
                    });
                    container.parentElement.querySelector('.error-message').style.display = 'none';
                });
            });
        });

        // Radio Option Highlight Logic
        const radioOptions = document.querySelectorAll('.radio-option');
        radioOptions.forEach(option => {
            option.addEventListener('click', function() {
                const group = this.closest('.radio-group');
                group.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input').checked = true;
                group.parentElement.querySelector('.error-message').style.display = 'none';
            });
        });

        // Form Validation
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            let isValid = true;
            // Simplified validation for demo
            if(document.getElementById('penilaian_keseluruhan').value === "0") {
                document.getElementById('error1').style.display = 'block';
                isValid = false;
            }
            if(!isValid) e.preventDefault();
            else alert('Maklum balas dihantar! (Simulasi)');
        });
    });
</script>
</body>
</html>
